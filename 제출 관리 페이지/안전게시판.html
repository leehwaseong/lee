<!DOCTYPE HTML>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>체크리스트 선택</title>
    <link rel="stylesheet" href="assets/css/main.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            flex-direction: column;
            margin: 0;
            background-color: #dfe6e9;
            color: #222;
            position: relative;
        }

        header h1, header p { color: black; }

        .button-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            justify-content: center;
            align-items: center;
            margin-top: 20px;
            width: 100%;
        }

        .button {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 220px;
            height: 48px;
            font-size: 16px;
            border-radius: 6px;
            text-decoration: none;
            color: white;
            font-weight: bold;
            transition: 0.25s;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
            border: 2px solid transparent;
        }

        .button.primary   { background-color: #28a745; border-color: #1e7e34; }
        .button.primary:hover   { background-color: #1e7e34; }

        .button.secondary { background-color: #007bff; border-color: #0056b3; }
        .button.secondary:hover { background-color: #0056b3; }

        /* TBM 버튼 전용 스타일 */
        .button.tbm       { background-color: #6f42c1; border-color: #59359a; }
        .button.tbm:hover { background-color: #59359a; }

        .back-button {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: white;
            color: black !important;
            border: 2px solid #6c757d;
            font-size: 14px;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            width: 80px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
        }
        .back-button:hover { background-color: #f0f0f0; }
    </style>
</head>
<body>

    <header>
        <h1>체크리스트 선택</h1>
        <p>실행할 체크리스트 항목을 선택하세요.</p>
    </header>

    <section class="button-container">
        <a href="security_check.html" class="button primary">🔐 보안 체크</a>
        <a href="작업전체크시트.html" class="button secondary">📝 작업 전 체크리스트</a>
        <!-- ⬇️ TBM 버튼 추가 -->
        <a href="tbm.html" class="button tbm">🧰 TBM 일지 제출</a>
    </section>

    <button class="back-button" onclick="history.back()">뒤로</button>

</body>
</html>
