<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TBM 일지 모바일 제출 v2</title>
  <style>
    :root{--bg:#0f172a;--card:#111827;--muted:#64748b;--fg:#e5e7eb;--acc:#22d3ee;--ok:#10b981;--warn:#f59e0b;--err:#ef4444;--border:#1f2937}
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;background:linear-gradient(180deg,#0b1220,#0a0f1a);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Pretendard,Apple SD Gothic Neo,Malgun Gothic,sans-serif}
    .wrap{max-width:980px;margin:0 auto;padding:16px}
    header{position:sticky;top:0;background:rgba(11,17,32,.8);backdrop-filter:blur(10px);z-index:10;border-bottom:1px solid var(--border)}
    .brand{display:flex;align-items:center;gap:10px;padding:10px 16px}
    .brand h1{font-size:18px;margin:0;font-weight:700}

    .card{background:linear-gradient(180deg,#0f172a,#0b1220);border:1px solid var(--border);border-radius:16px;box-shadow:0 6px 30px rgba(0,0,0,.35);padding:16px;margin:14px 0}
    .card h2{font-size:16px;margin:0 0 12px}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    @media (max-width:760px){.row{grid-template-columns:1fr}}
    label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
    input[type="text"],input[type="date"],input[type="time"],textarea,select{width:100%;background:#0b1220;border:1px solid var(--border);color:var(--fg);border-radius:12px;padding:12px;font-size:15px;outline:none}
    textarea{min-height:96px;resize:vertical}
    .chips{display:flex;flex-wrap:wrap;gap:8px}
    .chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--border);padding:8px 10px;border-radius:999px;background:#0b1220}
    .muted{color:var(--muted)}
    .btn{appearance:none;border:1px solid var(--border);background:#0b1220;color:var(--fg);padding:12px 14px;border-radius:12px;font-weight:600;cursor:pointer}
    .btn:hover{border-color:#263043}
    .btn.primary{background:linear-gradient(135deg,#0891b2,#22c55e);border:none}
    .btn.warn{background:#1a1305;border-color:#7c4a03}
    .btn.ghost{background:transparent}
    .btnbar{display:flex;gap:10px;flex-wrap:wrap}
    .hint{font-size:12px;color:var(--muted)}
    .req::after{content:" *";color:var(--warn)}

    .sig{border:1px dashed #334155;background:#0a0f1a;border-radius:12px;position:relative}
    .sig canvas{width:100%;height:180px;border-radius:12px;touch-action:none}
    .sig .tools{position:absolute;right:10px;bottom:10px;display:flex;gap:6px}
    .sig .tools .btn{padding:6px 10px;font-size:12px}

    .stickybar{position:sticky;bottom:0;backdrop-filter:blur(8px);background:rgba(15,23,42,.8);border-top:1px solid var(--border);padding:10px;margin-top:16px}
    .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;background:#0b1220;border:1px solid var(--border);padding:10px 14px;border-radius:12px;display:none;z-index:80}

    .kvs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    @media (max-width:760px){.kvs{grid-template-columns:1fr}}

    .sheet{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}
    @media (min-width:980px){.sheet{grid-template-columns:repeat(5,1fr)}}
    .slot{border:1px dashed #334155;border-radius:12px;padding:10px;background:#0b1220;display:flex;flex-direction:column;gap:8px}
    .slot .row2{display:grid;grid-template-columns:1fr;gap:8px}
    .slot .preview{height:120px;background:#0a0f1a;border:1px solid var(--border);border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden}
    .slot .preview img{max-width:100%;max-height:100%;display:block}

    .modal{position:fixed;inset:0;background:rgba(2,6,23,.7);display:none;align-items:center;justify-content:center;z-index:70}
    .modal.open{display:flex}
    .modal .panel{width:min(820px,96vw);background:#0b1220;border:1px solid var(--border);border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,.6);padding:14px}
    .sigPad{border:1px dashed #334155;background:#0a0f1a;border-radius:12px}
    .sigPad canvas{width:100%;height:360px;border-radius:12px;touch-action:none}
    .panel .btnbar{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}

    html,body{overscroll-behavior:contain}
    body.modal-open{position:fixed;overflow:hidden;width:100%}
    /* 중요: 모달 내부에서도 포인터 이벤트가 정상 동작해야 함 */
    .modal,.modal *{touch-action:none;pointer-events:auto}
    .modal .panel{max-height:90vh;overflow:auto}
  </style>
</head>
<body>
  <header>
    <div class="brand wrap">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M12 2l2.39 4.84L20 8l-4 3.9.95 5.52L12 15.77 7.05 17.42 8 11.9 4 8l5.61-1.16L12 2z" stroke="#22d3ee" stroke-width="1.2" fill="none"/></svg>
      <h1>TBM 일지 모바일 제출 v2</h1>
      <span class="btn ghost" id="autosaveStatus">자동저장 켜짐</span>
    </div>
  </header>

  <form id="tbmForm" class="wrap" method="POST" action="https://script.google.com/macros/s/AKfycbzJgnELL4veik5-zqTmKb05AOLWm3iBw1UkhIcK_h3UrSVTHVXz0lygWmEgjf9yZf5_zA/exec" enctype="multipart/form-data">
    <div class="card">
      <h2>기본 정보</h2>
      <div class="row">
        <div><label class="req">작성 일자</label><input type="date" name="date" id="date" required /></div>
        <div><label>작성 시간</label><input type="time" name="time" id="time" /></div>
        <div><label class="req">현장명</label><input type="text" name="site" placeholder="예) 삼성디스플레이 평택 A동" required /></div>
        <div><label>구역/라인</label><input type="text" name="zone" placeholder="예) 3층 배관공사 구역" /></div>
      </div>
      <div class="row">
        <div><label class="req">작업명</label><input type="text" name="job" placeholder="예) 배관 인양 및 설치" required /></div>
        <div><label>TBM 리더</label><input type="text" name="leader" placeholder="예) 이화성" /></div>
      </div>
    </div>

    <div class="card">
      <h2>작업 절차</h2>
      <div class="row">
        <div><label class="req">작업 내용 / 절차</label><textarea name="procedure" placeholder="작업 순서대로 단계별로 간단히 기입" required></textarea></div>
        <div><label>필요 장비/도구</label><textarea name="tools" placeholder="지게차, 체인블록, 안전대 등"></textarea></div>
      </div>
    </div>

    <div class="card">
      <h2>위험요인 & 안전조치</h2>
      <div class="chips" role="group" aria-label="위험요인">
        <label class="chip"><input type="checkbox" name="hazards[]" value="추락"/> 추락</label>
        <label class="chip"><input type="checkbox" name="hazards[]" value="낙하"/> 낙하</label>
        <label class="chip"><input type="checkbox" name="hazards[]" value="협착/끼임"/> 협착/끼임</label>
        <label class="chip"><input type="checkbox" name="hazards[]" value="전도/충돌"/> 전도/충돌</label>
        <label class="chip"><input type="checkbox" name="hazards[]" value="감전"/> 감전</label>
        <label class="chip"><input type="checkbox" name="hazards[]" value="화학물질"/> 화학물질</label>
        <label class="chip"><input type="checkbox" name="hazards[]" value="화재/폭발"/> 화재/폭발</label>
        <label class="chip"><input type="checkbox" name="hazards[]" value="소음/분진"/> 소음/분진</label>
      </div>
      <div class="row" style="margin-top:10px">
        <div><label>세부 위험요인 (자유기술)</label><textarea name="hazard_detail" placeholder="예) 상부 작업 중 렌치 낙하 위험"></textarea></div>
        <div><label>예방대책 / 보호구</label><textarea name="controls" placeholder="예) 안전난간 설치, 낙하물 방지망, 안전대 100% 착용"></textarea></div>
      </div>
    </div>

    <div class="card">
      <h2>TBM 리더 서명</h2>
      <div class="kvs">
        <div><label>리더 성명</label><input type="text" name="leader_name" placeholder="성명" /></div>
        <div><label>소속/직책</label><input type="text" name="leader_org" placeholder="예) 온세미로이엔지 / 대리" /></div>
      </div>
      <div class="sig" data-name="leader_signature">
        <canvas></canvas>
        <div class="tools">
          <button type="button" class="btn ghost" data-act="undo">되돌리기</button>
          <button type="button" class="btn" data-act="clear">지우기</button>
        </div>
      </div>
      <input type="hidden" name="leader_signature_data" />
      <div class="hint">마우스/펜/손가락으로 서명하세요.</div>
    </div>

    <div class="card" id="attendeeSheetCard">
      <h2>참석자 서명지 (최대 30명)</h2>
      <div class="hint">각 칸을 눌러 서명 팝업을 열어 주세요. 완료를 누르면 이미지가 채워집니다.</div>
      <div id="attendeeSheet" class="sheet"></div>
      <div class="hint">※ 모바일 최적화를 위해 <b>성명만</b> 입력합니다.</div>
    </div>

    <div class="card">
      <h2>기타</h2>
      <div class="row">
        <div><label>비고</label><textarea name="notes" placeholder="특이사항, 위험성평가 번호 등"></textarea></div>
        <div>
          <label>사진 (선택)</label>
          <input type="file" name="photo" accept="image/*" capture="environment" />
          <div class="hint">* 메일 첨부 한도(약 25MB) 초과 시 전송이 실패할 수 있어요.</div>
        </div>
      </div>
    </div>

    <div class="stickybar">
      <div class="btnbar">
        <button type="button" class="btn" id="saveDraft">임시저장</button>
        <button type="button" class="btn warn" id="clearDraft">임시저장 삭제</button>
        <button class="btn primary" type="submit">제출하기</button>
      </div>
      <div class="hint" id="submitHint">제출 시 PDF가 생성되어 지정 이메일로 발송됩니다.</div>
    </div>

    <input type="hidden" name="client_pdf_b64" id="client_pdf_b64" />
    <input type="hidden" name="attendees_json" id="attendees_json" />
  </form>

  <div id="sigModal" class="modal" role="dialog" aria-modal="true" aria-label="서명">
    <div class="panel">
      <h2 style="margin:0 0 8px">참석자 서명</h2>
      <div class="sigPad"><canvas></canvas></div>
      <div class="btnbar">
        <button type="button" class="btn" data-act="undo">되돌리기</button>
        <button type="button" class="btn" data-act="clear">지우기</button>
        <button type="button" class="btn primary" data-act="done">완료</button>
      </div>
    </div>
  </div>

  <div id="resultModal" class="modal" role="dialog" aria-modal="true" aria-label="제출 결과">
    <div class="panel">
      <h2 style="margin:0 0 8px">제출 완료</h2>
      <p class="muted" id="resultMsg">메일함에서 PDF를 확인하세요.</p>
      <div class="btnbar" id="resultLinks" style="display:none">
        <a id="openPdf" class="btn" target="_blank" rel="noopener">PDF 열기</a>
        <a id="openDoc" class="btn" target="_blank" rel="noopener">문서 열기</a>
        <button type="button" class="btn primary" id="closeResult">확인</button>
      </div>
      <div class="btnbar"><button type="button" class="btn primary" id="closeResult2">확인</button></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>

  <!-- ====== 메인 앱 로직 (서명 드로잉 버그 수정 포함) ====== -->
  <script>
  (function(){
    const $  = (sel)=>document.querySelector(sel);
    const $$ = (sel)=>Array.from(document.querySelectorAll(sel));
    const toast = (msg)=>{ const t=$('#toast'); t.textContent=msg; t.style.display='block'; setTimeout(()=>t.style.display='none',1600); };

    const now = new Date();
    $('#date').value = now.toISOString().slice(0,10);
    $('#time').value = now.toTimeString().slice(0,5);

    let __lockY=0;
    function __lockScroll(){ __lockY=window.scrollY||0; document.body.style.top=`-${__lockY}px`; document.body.classList.add('modal-open'); }
    function __unlockScroll(){ document.body.classList.remove('modal-open'); const y=__lockY; document.body.style.top=''; window.scrollTo(0,y); }

    // --- SignaturePad (버그수정판) ---
    function createSignaturePad(container, height=180){
      const canvas=container.querySelector('canvas');
      const undoBtn=container.querySelector('[data-act="undo"]');
      const clearBtn=container.querySelector('[data-act="clear"]');
      const ctx=canvas.getContext('2d');
      let paths=[], drawing=false, needs=false;

      // 중요: 일부 브라우저에서 포인터 캡처가 해제되지 않아 다음 사용자에서 드로잉이 안 되던 현상 수정
      function releaseCapture(e){ try{ if(e && e.pointerId!=null) canvas.releasePointerCapture(e.pointerId); }catch(_){} }

      function redraw(){
        needs=false; ctx.clearRect(0,0,canvas.width,canvas.height); ctx.save();
        paths.forEach(path=>{
          if(path.length<2){ const p=path[0]; ctx.beginPath(); ctx.arc(p.x,p.y,1.1,0,Math.PI*2); ctx.fillStyle='#e5e7eb'; ctx.fill(); return; }
          ctx.beginPath(); ctx.moveTo(path[0].x,path[0].y); for(let i=1;i<path.length;i++) ctx.lineTo(path[i].x,path[i].y); ctx.stroke();
        }); ctx.restore();
      }
      function raf(){ if(!needs){ needs=true; requestAnimationFrame(redraw); } }

      function fit(){
        const dpr=Math.max(1, window.devicePixelRatio||1);
        const rect=container.getBoundingClientRect();
        const w = Math.max(1, rect.width || container.clientWidth || 1);
        canvas.width=w*dpr; canvas.height=height*dpr;
        canvas.style.width=w+'px'; canvas.style.height=height+'px';
        ctx.setTransform(1,0,0,1,0,0); ctx.scale(dpr,dpr);
        ctx.lineCap='round'; ctx.lineJoin='round'; ctx.lineWidth=2.2; ctx.strokeStyle='#e5e7eb';
        redraw();
      }

      // 이벤트 바인딩
      const supportsPointer = 'PointerEvent' in window;
      function getPt(e){ const r=canvas.getBoundingClientRect(); const src = e.touches ? e.touches[0] : e; return {x:src.clientX - r.left, y:src.clientY - r.top}; }

      // 각 리스너는 나중에 dispose를 위해 참조 저장
      const handlers = [];

      function bind(){
        // 공통: 캔버스가 항상 드로잉 대상이 되도록
        canvas.style.touchAction='none';

        if(supportsPointer){
          const down=(e)=>{ e.preventDefault(); try{ canvas.setPointerCapture(e.pointerId); }catch(_){} drawing=true; paths.push([getPt(e)]); raf(); };
          const move=(e)=>{ if(!drawing) return; e.preventDefault(); const p=paths[paths.length-1]; p.push(getPt(e)); raf(); };
          const up =(e)=>{ drawing=false; releaseCapture(e); };
          const cancel=(e)=>{ drawing=false; releaseCapture(e); };
          canvas.addEventListener('pointerdown', down, {passive:false});
          canvas.addEventListener('pointermove', move, {passive:false});
          canvas.addEventListener('pointerup',   up,   {passive:false});
          canvas.addEventListener('pointercancel', cancel, {passive:false});
          handlers.push(['pointerdown',down],['pointermove',move],['pointerup',up],['pointercancel',cancel]);
        } else {
          const tstart=(e)=>{ e.preventDefault(); drawing=true; paths.push([getPt(e)]); raf(); };
          const tmove =(e)=>{ if(!drawing) return; e.preventDefault(); const p=paths[paths.length-1]; p.push(getPt(e)); raf(); };
          const tend  =()=>{ drawing=false; };
          const mdown =(e)=>{ e.preventDefault(); drawing=true; paths.push([getPt(e)]); raf(); };
          const mmove =(e)=>{ if(!drawing) return; const p=paths[paths.length-1]; p.push(getPt(e)); raf(); };
          const mup   =()=>{ drawing=false; };
          const mleave=()=>{ drawing=false; };
          canvas.addEventListener('touchstart', tstart, {passive:false});
          canvas.addEventListener('touchmove',  tmove,  {passive:false});
          canvas.addEventListener('touchend',   tend,   {passive:false});
          canvas.addEventListener('touchcancel',tend,   {passive:false});
          canvas.addEventListener('mousedown',  mdown);
          canvas.addEventListener('mousemove',  mmove);
          canvas.addEventListener('mouseup',    mup);
          canvas.addEventListener('mouseleave', mleave);
          handlers.push(['touchstart',tstart],['touchmove',tmove],['touchend',tend],['touchcancel',tend],['mousedown',mdown],['mousemove',mmove],['mouseup',mup],['mouseleave',mleave]);
        }

        undoBtn?.addEventListener('click', undo);
        clearBtn?.addEventListener('click', clear);
        window.addEventListener('resize', fit);
        handlers.push(['_undo', undo], ['_clear', clear], ['_resize', fit]);
      }

      function unbind(){
        handlers.forEach(([type, fn])=>{
          if(type === '_undo' || type === '_clear'){
            const btn = (type==='_undo'?undoBtn:clearBtn);
            btn?.removeEventListener('click', fn);
          } else if (type === '_resize') {
            window.removeEventListener('resize', fn);
          } else {
            canvas.removeEventListener(type, fn);
          }
        });
        handlers.length = 0;
      }

      function undo(){ paths.pop(); raf(); }
      function clear(){ paths=[]; raf(); }

      function toDataURL(){
        const w=canvas.clientWidth,h=canvas.clientHeight;
        const off=document.createElement('canvas'); off.width=w; off.height=h;
        const octx=off.getContext('2d'); octx.fillStyle='#0a0f1a'; octx.fillRect(0,0,w,h);
        octx.lineCap='round'; octx.lineJoin='round'; octx.lineWidth=2.2; octx.strokeStyle='#e5e7eb';
        paths.forEach(path=>{
          if(path.length<2){ const p=path[0]; octx.beginPath(); octx.arc(p.x,p.y,1.1,0,Math.PI*2); octx.fillStyle='#e5e7eb'; octx.fill(); return; }
          octx.beginPath(); octx.moveTo(path[0].x,path[0].y); for(let i=1;i<path.length;i++) octx.lineTo(path[i].x,path[i].y); octx.stroke();
        });
        return off.toDataURL('image/png');
      }

      // 초기화
      bind();
      fit();

      return {
        toDataURL,
        undo, clear,
        resize: fit,
        dispose(){ unbind(); paths=[]; drawing=false; }
      };
    }

    // 리더 서명패드 (고정)
    const leaderPad = createSignaturePad(document.querySelector('.sig[data-name="leader_signature"]'));
    window.leaderPad = leaderPad;

    // 참석자 시트 렌더
    const sheet = $('#attendeeSheet'); const MAX=30; const slots=[];
    function renderSheet(){
      sheet.innerHTML='';
      for(let i=0;i<MAX;i++){
        const slot=document.createElement('div'); slot.className='slot'; slot.dataset.index=i;
        slot.innerHTML=`
          <div class="row2"><input type="text" name="attendee_${i}_name" placeholder="성명"/></div>
          <div class="preview" data-open><span class="muted">서명하려면 클릭</span></div>
          <input type="hidden" name="attendee_${i}_signature_data" />
        `;
        sheet.appendChild(slot); slots.push(slot);
      }
    }
    renderSheet();

    // 참석자 서명 모달
    const modal=$('#sigModal');
    let pad = null; // 매번 새로 생성/폐기하여 포인터 캡처 잔류 버그 방지
    let currentSlot=null;

    function openSigModal(){ modal.classList.add('open'); __lockScroll(); setTimeout(()=>{ pad?.resize(); }, 30); }
    function closeSigModal(){ modal.classList.remove('open'); __unlockScroll(); if(pad){ pad.dispose(); pad=null; } }

    sheet.addEventListener('click',e=>{
      const box=e.target.closest('[data-open]'); if(!box) return;
      currentSlot=e.target.closest('.slot');
      if(pad){ pad.dispose(); pad=null; }
      pad = createSignaturePad(modal.querySelector('.sigPad'), 360);
      openSigModal();
    });

    modal.addEventListener('click',e=>{ if(e.target===modal){ closeSigModal(); } });
    modal.addEventListener('touchmove',e=>{ e.preventDefault(); }, {passive:false});
    modal.querySelector('[data-act="undo"]').addEventListener('click',()=>pad?.undo());
    modal.querySelector('[data-act="clear"]').addEventListener('click',()=>pad?.clear());
    modal.querySelector('[data-act="done"]').addEventListener('click',()=>{
      if(!currentSlot || !pad) return;
      const data=pad.toDataURL();
      currentSlot.querySelector('input[type="hidden"]').value=data;
      currentSlot.querySelector('.preview').innerHTML=`<img alt="서명" src="${data}"/>`;
      // 실시간 저장 트리거 (Firebase 블록에서 처리)
      document.getElementById('tbmForm').dispatchEvent(new Event('change',{bubbles:true}));
      toast('서명 저장됨');
      closeSigModal();
    });

    // 안전장치: 모달 클래스 변화를 감지해 리사이즈
    const mo=new MutationObserver(ms=>{ ms.forEach(m=>{ if(m.attributeName==='class'){ if(modal.classList.contains('open')){ pad?.resize(); } } }); });
    mo.observe(modal,{attributes:true});

    // 로컬 임시저장
    const KEY='tbm_form_v2_sheet';
    function snapshot(){
      const form=new FormData($('#tbmForm')); form.delete('photo');
      const obj={}; form.forEach((v,k)=>{obj[k]=v});
      try{ obj.leader_signature_data = (window.leaderPad?.toDataURL()) || ""; }catch{ obj.leader_signature_data=""; }
      $$('#attendeeSheet .slot').forEach((slot,i)=>{
        obj[`attendee_${i}_name`]=slot.querySelector(`input[name="attendee_${i}_name"]`).value || "";
        obj[`attendee_${i}_signature_data`]=slot.querySelector('input[type="hidden"]').value || "";
      });
      return obj;
    }
    function saveDraft(){ localStorage.setItem(KEY,JSON.stringify(snapshot())); $('#autosaveStatus').textContent='임시저장 완료'; setTimeout(()=>$('#autosaveStatus').textContent='자동저장 켜짐',1200); }
    function loadDraft(){
      const raw=localStorage.getItem(KEY); if(!raw) return;
      try{ const obj=JSON.parse(raw);
        Object.entries(obj).forEach(([k,v])=>{ const el=document.querySelector(`[name="${k}"]`); if(!el||el.type==='file') return; el.value=v; });
        $$('#attendeeSheet .slot').forEach(slot=>{ const data=slot.querySelector('input[type="hidden"]').value; if(data){ slot.querySelector('.preview').innerHTML=`<img alt="서명" src="${data}"/>`; }});
        toast('임시저장을 복원했습니다');
      }catch(e){console.warn(e);} }
    $('#tbmForm').addEventListener('change',saveDraft);
    $('#saveDraft').addEventListener('click',()=>{saveDraft();toast('임시저장 완료');});
    $('#clearDraft').addEventListener('click',()=>{localStorage.removeItem(KEY);toast('임시저장 삭제');});
    loadDraft();

    // 제출 (기존 로직 유지)
    const blobToBase64 = (blob)=>new Promise((resolve,reject)=>{ const r=new FileReader(); r.onloadend=()=>resolve(String(r.result).split(',')[1]); r.onerror=reject; r.readAsDataURL(blob); });
    async function downscaleToJpeg(file, maxW=1600, quality=0.85) {
      if (!/^image\//i.test(file.type)) return null;
      return new Promise((resolve)=>{
        const img = new Image();
        img.onload = ()=>{
          const scale = Math.min(1, maxW / img.width);
          const w = Math.round(img.width * scale);
          const h = Math.round(img.height * scale);
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          canvas.toBlob(b=>{ if(!b) return resolve(null); resolve(new File([b], 'photo.jpg', { type: 'image/jpeg' })); }, 'image/jpeg', quality);
        };
        img.onerror = ()=>resolve(null);
        img.src = URL.createObjectURL(file);
      });
    }

    $('#tbmForm').addEventListener('submit', async (e)=>{
      e.preventDefault();
      const formEl=$('#tbmForm'); const submitBtn=formEl.querySelector('button[type="submit"]');
      submitBtn.disabled=true; $('#submitHint').textContent='제출 중...';

      document.querySelector('input[name="leader_signature_data"]').value = (window.leaderPad?.toDataURL()) || "";
      const attendees=[]; $$('#attendeeSheet .slot').forEach(slot=>{ const name=slot.querySelector('input[name$="_name"]').value.trim(); const sig =slot.querySelector('input[type="hidden"]').value; if(name||sig){attendees.push({name,role:'',signature:sig});} });
      $('#attendees_json').value=JSON.stringify(attendees);
      if(attendees.length===0){ toast('참석자 서명을 1명 이상 입력하세요'); submitBtn.disabled=false; $('#submitHint').textContent='제출 시 PDF가 생성되어 지정 이메일로 발송됩니다.'; return; }

      try{
        const { jsPDF } = window.jspdf;
        window.scrollTo(0,0);
        const target=document.body; // TODO: 제출용 전용 영역으로 전환 권장
        const canvas=await html2canvas(target,{scale:2.5,useCORS:true,backgroundColor:null});
        const imgData=canvas.toDataURL('image/jpeg',0.95);

        const pdf=new jsPDF('p','mm','a4');
        const pdfW=210, pdfH=297;
        const imgProps=pdf.getImageProperties(imgData);
        const imgH=(imgProps.height*pdfW)/imgProps.width;
        let heightLeft=imgH, position=0;
        pdf.addImage(imgData,'JPEG',0,0,pdfW,imgH,'','FAST');
        heightLeft -= pdfH;
        while(heightLeft>0){ pdf.addPage(); position = heightLeft - imgH; pdf.addImage(imgData,'JPEG',0,position,pdfW,imgH,'','FAST'); heightLeft -= pdfH; }

        const blob=pdf.output('blob');
        $('#client_pdf_b64').value = await blobToBase64(blob);

        const fd=new FormData(formEl);
        const fileInput = document.querySelector('input[name="photo"]');
        if (fileInput?.files?.[0]) {
          const jpg = await downscaleToJpeg(fileInput.files[0], 1600, 0.85);
          if (jpg) fd.append('photo_jpg', jpg);
        }
        try{ const fname=`TBM_${($('[name="site"]').value||'SITE')}_${($('#date').value||'')}.pdf`; fd.append('client_pdf', new File([blob], fname, {type:'application/pdf'})); }catch(_){ }

        try{
          const res=await fetch(formEl.action,{method:'POST',body:fd});
          const data=await res.json().catch(()=>null);
          openResultModal(data && data.ok ? data : null);
        }catch(_){
          let iframe=document.getElementById('tbmHiddenFrame');
          if(!iframe){ iframe=document.createElement('iframe'); iframe.name='tbmHiddenFrame'; iframe.id='tbmHiddenFrame'; iframe.style.display='none'; document.body.appendChild(iframe); }
          const originalTarget=formEl.target; formEl.target='tbmHiddenFrame'; formEl.submit(); formEl.target=originalTarget; openResultModal(null);
        }
      }catch(err){ console.error(err); toast('PDF 생성 중 오류가 발생했습니다.'); submitBtn.disabled=false; $('#submitHint').textContent='제출 실패'; }

      function resetForm(){
        formEl.reset(); try{window.leaderPad?.clear();}catch(_){}
        $$('#attendeeSheet .slot').forEach(slot=>{ slot.querySelector('input[type="text"]').value=''; slot.querySelector('input[type="hidden"]').value=''; slot.querySelector('.preview').innerHTML='<span class="muted">서명하려면 클릭</span>'; });
        localStorage.removeItem(KEY); $('#autosaveStatus').textContent='자동저장 켜짐';
      }
      function openResultModal(payload){
        const resultModal=$('#resultModal'); const linkBar=$('#resultLinks');
        const pdfA=$('#openPdf'); const docA=$('#openDoc'); const msg=$('#resultMsg');
        if(payload && payload.ok && (payload.pdf || payload.doc)){
          msg.textContent='제출이 완료되었습니다. 아래 링크로 확인하세요.'; linkBar.style.display='flex';
          if(payload.pdf){ pdfA.href=payload.pdf; pdfA.style.display='inline-block'; } else { pdfA.style.display='none'; }
          if(payload.doc){ docA.href=payload.doc; docA.style.display='inline-block'; } else { docA.style.display='none'; }
        }else{ msg.textContent='제출이 완료되었습니다. 메일함에서 PDF를 확인하세요.'; linkBar.style.display='none'; }
        resetForm(); __lockScroll(); resultModal.classList.add('open');
        $('#closeResult').onclick = $('#closeResult2').onclick = ()=>{ resultModal.classList.remove('open'); __unlockScroll(); };
        toast('제출 완료!'); $('#submitHint').textContent='제출 완료'; formEl.querySelector('button[type="submit"]').disabled=false;
      }
    });
  })();
  </script>

  <!-- ====== Firebase 실시간 동기화 (인증 후 구독 시작으로 안정화) ====== -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc, updateDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBrqsCFkkuA4Vy4wuTjGfF9QynPqkhCyo4",
      authDomain: "osmr-c319d.firebaseapp.com",
      projectId: "osmr-c319d",
      storageBucket: "osmr-c319d.appspot.com",
      messagingSenderId: "104492463557",
      appId: "1:104492463557:web:faace3332e6fe4a7a347ac",
      measurementId: "G-5WWWBTV5FK"
    };

    const app  = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db   = getFirestore(app);

    const ORG = "onsemiro";
    const formEl  = document.getElementById("tbmForm");
    const dateEl  = document.getElementById("date");
    const siteEl  = formEl.querySelector('[name="site"]');
    const statusEl= document.getElementById("autosaveStatus");

    function yymmddDash(){ const d = dateEl.value ? new Date(dateEl.value) : new Date(); return d.toISOString().slice(0,10); }
    function slug(s){ return (s||"DEFAULT").toString().trim().toLowerCase().replace(/[^a-z0-9가-힣]+/g,"-").replace(/^-+|-+$/g,"") || "default"; }
    function tbmDocRef(){ const id = `${yymmddDash()}_${slug(siteEl?.value)}`; return doc(db, "orgs", ORG, "tbm_sessions", id); }

    function takeSnapshot(){
      const data = {};
      const controls = formEl.querySelectorAll("input, select, textarea");
      controls.forEach(el=>{
        if (el.type === "file") return; const name = el.name || el.id; if (!name) return;
        if (el.type === "checkbox"){
          const group = formEl.querySelectorAll(`input[type="checkbox"][name="${el.name}"]`);
          if (group.length > 1){ if (!Array.isArray(data[name])) data[name] = []; if (el.checked) data[name].push(el.value || true); }
          else { data[name] = !!el.checked; }
        } else if (el.type === "radio") { if (el.checked) data[name] = el.value; }
        else { data[name] = el.value ?? ""; }
      });
      try { data["leader_signature_data"] = (window.leaderPad?.toDataURL()) || ""; } catch { data["leader_signature_data"] = ""; }
      document.querySelectorAll("#attendeeSheet .slot").forEach((slot,i)=>{
        data[`attendee_${i}_name`] = slot.querySelector(`input[name="attendee_${i}_name"]`)?.value || "";
        data[`attendee_${i}_signature_data`] = slot.querySelector('input[type="hidden"]')?.value || "";
      });
      return data;
    }

    let isApplying = false; let unsub = null; let authed = false;

    function applySnapshot(obj){
      isApplying = true;
      const controls = formEl.querySelectorAll("input, select, textarea");
      controls.forEach(el=>{
        if (el.type === "file") return; const name = el.name || el.id; if (!name) return; const v = obj[name]; if (v === undefined) return;
        if (el.type === "checkbox"){
          const group = formEl.querySelectorAll(`input[type="checkbox"][name="${el.name}"]`);
          if (group.length > 1 && Array.isArray(obj[name])){ el.checked = obj[name].includes(el.value || true); }
          else { el.checked = !!v; }
        } else if (el.type === "radio"){ el.checked = (el.value == v); }
        else { if (document.activeElement !== el) { const nv=String(v ?? ""); if (el.value !== nv) el.value = nv; } }
      });
      document.querySelectorAll("#attendeeSheet .slot").forEach((slot,i)=>{
        const s = obj[`attendee_${i}_signature_data`];
        slot.querySelector(".preview").innerHTML = s ? `<img alt="서명" src="${s}"/>` : `<span class="muted">서명하려면 클릭</span>`;
        const hidden = slot.querySelector('input[type="hidden"]'); if (hidden) hidden.value = s || "";
      });
      isApplying = false;
      if (statusEl) statusEl.textContent = "실시간 동기화 연결됨";
    }

    async function ensureAndSubscribe(){
      if (!authed) return; // 인증 전 호출 차단
      const ref = tbmDocRef();
      const snap = await getDoc(ref);
      if (!snap.exists()){ await setDoc(ref, { form: takeSnapshot(), updatedAt: serverTimestamp() }, { merge: true }); }
      if (unsub) { unsub(); unsub = null; }
      unsub = onSnapshot(ref, (ds)=>{ if (!ds.exists()) return; const d = ds.data(); if (d?.form) applySnapshot(d.form); });
    }

    let timer=null;
    function saveDebounced(){ if (isApplying || !authed) return; clearTimeout(timer); timer = setTimeout(async ()=>{
      try{ await updateDoc(tbmDocRef(), { form: takeSnapshot(), updatedAt: serverTimestamp() }); if (statusEl) { statusEl.textContent = "실시간 저장됨"; setTimeout(()=>{ statusEl.textContent = "자동저장 켜짐"; }, 1000); } }
      catch(e){ await setDoc(tbmDocRef(), { form: takeSnapshot(), updatedAt: serverTimestamp() }, { merge: true }); }
    }, 400); }

    // 인증 완료 후에만 구독 시작 (중요 패치)
    onAuthStateChanged(auth, (u)=>{
      if (!u) { signInAnonymously(auth).catch(console.error); return; }
      authed = true; ensureAndSubscribe();
    });

    formEl.addEventListener("input",  saveDebounced);
    formEl.addEventListener("change", saveDebounced);
    dateEl?.addEventListener("change", ensureAndSubscribe);
    siteEl?.addEventListener("input",  ensureAndSubscribe);
  </script>

  <!-- (참고) Firestore 규칙
  rules_version = '2';
  service cloud.firestore {
    match /databases/{database}/documents {
      match /orgs/{orgId}/tbm_sessions/{docId} {
        allow read, write: if request.auth != null; // 익명 로그인 허용
      }
    }
  } -->
</body>
