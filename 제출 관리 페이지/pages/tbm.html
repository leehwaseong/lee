<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TBM 보고서</title>
    <link rel="stylesheet" href="../styles/common.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .phone-container { width: 375px; height: 812px; background: white; border-radius: 25px; box-shadow: 0 20px 40px rgba(0,0,0,0.3); overflow: hidden; display: flex; flex-direction: column; }
        .page-header { display: flex; align-items: center; gap: 15px; padding: 15px 20px; border-bottom: 2px solid #f0f0f0; background: white; }
        .back-btn { background: none; border: none; font-size: 20px; cursor: pointer; padding: 5px; color: #2196F3; text-decoration: none; }
        .page-title { font-size: 20px; font-weight: bold; color: #333; flex: 1; }
        .page-content { flex: 1; padding: 20px; overflow-y: auto; }
        .info-box { background: #e3f2fd; padding: 15px; border-radius: 10px; margin-bottom: 20px; border-left: 4px solid #2196F3; }
        .form-group { margin-bottom: 20px; }
        .form-label { display: block; font-weight: 600; margin-bottom: 8px; color: #333; }
        .form-input { width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 16px; }
        .form-input:focus { outline: none; border-color: #2196F3; }
        .worker-signature-group { background: #f8f9fa; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #e0e0e0; }
        .signature-area { border: 2px solid #2196F3; height: 150px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #666; cursor: pointer; background: white; position: relative; margin-bottom: 10px; }
        .signature-canvas { width: 100%; height: 100%; cursor: crosshair; }
        .signature-controls { display: flex; gap: 10px; margin-top: 5px; }
        .clear-signature { background: #ff4444; color: white; border: none; padding: 5px 10px; border-radius: 5px; font-size: 12px; cursor: pointer; }
        .signature-status { background: #ff4444; color: white; border: none; padding: 5px 10px; border-radius: 5px; font-size: 12px; }
        .add-worker-btn { background: #2196F3; color: white; border: none; padding: 10px 15px; border-radius: 8px; cursor: pointer; width: 100%; margin-top: 10px; }
        .submit-btn { width: 100%; background: linear-gradient(135deg, #2196F3, #1976D2); color: white; border: none; padding: 15px; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 20px; }
        .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="phone-container">
        <div class="page-header">
            <a href="../index.html" class="back-btn">‹</a>
            <div class="page-title">TBM 보고서</div>
        </div>
        
        <div class="page-content">
            <div class="info-box">
                <strong>✨ 자동 전송 기능!</strong><br>
                서명 완료 후 제출하면 <strong>PDF 자동 생성 + Gmail 전송</strong>됩니다!
            </div>
            
            <form id="tbm-form">
                <div class="form-group">
                    <label class="form-label">📅 날짜</label>
                    <input type="date" class="form-input" id="tbm-date" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label">📍 현장 위치</label>
                    <input type="text" class="form-input" id="tbm-location" placeholder="현장 위치를 입력하세요" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label">🔨 금일 진행 작업</label>
                    <textarea class="form-input" rows="3" id="tbm-work" placeholder="오늘 진행할 작업 내용을 입력하세요" required></textarea>
                </div>
                
                <div class="form-group">
                    <label class="form-label">⚠️ 예상 위험요인 및 감소대책</label>
                    <div id="risk-factors-container">
                        <div class="worker-signature-group risk-factor-group">
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                                <span style="font-weight: 600; color: #666;">위험요인 1</span>
                                <button type="button" class="clear-signature" onclick="removeRiskFactor(this)">삭제</button>
                            </div>
                            <input type="text" class="form-input risk-factor" placeholder="위험요인" style="margin-bottom: 10px;" required>
                            <input type="text" class="form-input risk-measure" placeholder="→ 감소대책" style="padding-left: 25px;">
                        </div>
                    </div>
                    <button type="button" class="add-worker-btn" onclick="addRiskFactor()">+ 위험요인 추가</button>
                </div>
                
                <div class="form-group">
                    <label class="form-label">👨‍💼 TBM 진행자</label>
                    <input type="text" class="form-input" id="tbm-supervisor" placeholder="진행자 성명" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label">👨‍💼 TBM 진행자 서명</label>
                    <div class="signature-area">
                        <canvas class="signature-canvas" id="supervisor-canvas" width="300" height="140"></canvas>
                    </div>
                    <div class="signature-controls">
                        <button type="button" class="clear-signature" onclick="clearCanvas('supervisor-canvas')">지우기</button>
                        <span class="signature-status" id="supervisor-status">서명 필요</span>
                    </div>
                </div>
                
                <div class="form-group">
                    <label class="form-label">👥 참여 근로자 서명</label>
                    <div id="workers-container">
                        <div class="worker-signature-group" data-worker-index="0">
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                                <span style="font-weight: 600; color: #666;">근로자 1</span>
                                <button type="button" class="clear-signature" onclick="removeWorker(this)">삭제</button>
                            </div>
                            <input type="text" class="form-input worker-name" placeholder="성명" style="margin-bottom: 15px;" required>
                            <div class="signature-area">
                                <canvas class="signature-canvas worker-canvas" width="300" height="120"></canvas>
                            </div>
                            <div class="signature-controls">
                                <button type="button" class="clear-signature" onclick="clearWorkerCanvas(this)">지우기</button>
                                <span class="signature-status">서명 필요</span>
                            </div>
                        </div>
                    </div>
                    <button type="button" class="add-worker-btn" onclick="addWorker()">+ 근로자 추가</button>
                </div>
                
                <button type="submit" class="submit-btn">📋 TBM 보고서 제출 (PDF 생성)</button>
            </form>
        </div>
    </div>

    <script>
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwFZV52nxaHxWvChSZV_ET_ckAQis9s6KaMQ3nE6R02CR04mMxT_IJqxX7Gmmofzxw9bg/exec';
        let workerCount = 1;
        
        document.addEventListener('DOMContentLoaded', function() {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('tbm-date').value = today;
            initSignatureCanvases();
        });
        
        function initSignatureCanvases() {
            document.querySelectorAll('.signature-canvas').forEach(canvas => setupCanvas(canvas));
        }
        
        function setupCanvas(canvas) {
            const ctx = canvas.getContext('2d');
            let isDrawing = false;
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            
            canvas.addEventListener('mousedown', (e) => {
                isDrawing = true;
                const pos = getPosition(e, canvas);
                ctx.beginPath();
                ctx.moveTo(pos.x, pos.y);
            });
            
            canvas.addEventListener('mousemove', (e) => {
                if (!isDrawing) return;
                e.preventDefault();
                const pos = getPosition(e, canvas);
                ctx.lineWidth = 2;
                ctx.lineCap = 'round';
                ctx.strokeStyle = '#2196F3';
                ctx.lineTo(pos.x, pos.y);
                ctx.stroke();
                updateSignatureStatus(canvas, true);
            });
            
            canvas.addEventListener('mouseup', () => { isDrawing = false; });
            canvas.addEventListener('touchstart', (e) => {
                e.preventDefault();
                const touch = e.touches[0];
                canvas.dispatchEvent(new MouseEvent('mousedown', { clientX: touch.clientX, clientY: touch.clientY }));
            });
            canvas.addEventListener('touchmove', (e) => {
                e.preventDefault();
                const touch = e.touches[0];
                canvas.dispatchEvent(new MouseEvent('mousemove', { clientX: touch.clientX, clientY: touch.clientY }));
            });
            canvas.addEventListener('touchend', (e) => {
                e.preventDefault();
                canvas.dispatchEvent(new MouseEvent('mouseup', {}));
            });
        }
        
        function getPosition(e, canvas) {
            const rect = canvas.getBoundingClientRect();
            return { x: e.clientX - rect.left, y: e.clientY - rect.top };
        }
        
        function updateSignatureStatus(canvas, signed) {
            const area = canvas.closest('.form-group') || canvas.closest('.worker-signature-group');
            const status = area.querySelector('.signature-status');
            if (status) {
                status.textContent = signed ? '서명 완료' : '서명 필요';
                status.style.backgroundColor = signed ? '#4CAF50' : '#ff4444';
            }
        }
        
        function clearCanvas(canvasId) {
            const canvas = document.getElementById(canvasId);
            if (canvas) {
                canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
                updateSignatureStatus(canvas, false);
            }
        }
        
        function clearWorkerCanvas(btn) {
            const canvas = btn.closest('.worker-signature-group').querySelector('.worker-canvas');
            if (canvas) {
                canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
                updateSignatureStatus(canvas, false);
            }
        }
        
        function addRiskFactor() {
            const container = document.getElementById('risk-factors-container');
            const count = container.children.length + 1;
            const div = document.createElement('div');
            div.className = 'worker-signature-group risk-factor-group';
            div.innerHTML = `
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                    <span style="font-weight: 600; color: #666;">위험요인 ${count}</span>
                    <button type="button" class="clear-signature" onclick="removeRiskFactor(this)">삭제</button>
                </div>
                <input type="text" class="form-input risk-factor" placeholder="위험요인" style="margin-bottom: 10px;" required>
                <input type="text" class="form-input risk-measure" placeholder="→ 감소대책" style="padding-left: 25px;">
            `;
            container.appendChild(div);
            updateRiskFactorNumbers();
        }
        
        function removeRiskFactor(btn) {
            const container = document.getElementById('risk-factors-container');
            if (container.children.length <= 1) {
                alert('최소 1개의 위험요인이 필요합니다.');
                return;
            }
            btn.closest('.risk-factor-group').remove();
            updateRiskFactorNumbers();
        }
        
        function updateRiskFactorNumbers() {
            const container = document.getElementById('risk-factors-container');
            Array.from(container.children).forEach((group, index) => {
                const label = group.querySelector('span');
                if (label) label.textContent = `위험요인 ${index + 1}`;
            });
        }
        
        function addWorker() {
            const container = document.getElementById('workers-container');
            const div = document.createElement('div');
            div.className = 'worker-signature-group';
            div.setAttribute('data-worker-index', workerCount++);
            const workerNum = container.children.length + 1;
            div.innerHTML = `
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                    <span style="font-weight: 600; color: #666;">근로자 ${workerNum}</span>
                    <button type="button" class="clear-signature" onclick="removeWorker(this)">삭제</button>
                </div>
                <input type="text" class="form-input worker-name" placeholder="성명" style="margin-bottom: 15px;" required>
                <div class="signature-area">
                    <canvas class="signature-canvas worker-canvas" width="300" height="120"></canvas>
                </div>
                <div class="signature-controls">
                    <button type="button" class="clear-signature" onclick="clearWorkerCanvas(this)">지우기</button>
                    <span class="signature-status">서명 필요</span>
                </div>
            `;
            container.appendChild(div);
            setupCanvas(div.querySelector('.worker-canvas'));
            updateWorkerNumbers();
        }
        
        function removeWorker(btn) {
            const container = document.getElementById('workers-container');
            if (container.children.length <= 1) {
                alert('최소 1명의 근로자가 필요합니다.');
                return;
            }
            btn.closest('.worker-signature-group').remove();
            updateWorkerNumbers();
        }
        
        function updateWorkerNumbers() {
            const container = document.getElementById('workers-container');
            Array.from(container.children).forEach((group, index) => {
                const label = group.querySelector('span');
                if (label) label.textContent = `근로자 ${index + 1}`;
            });
        }
        
        async function sendEmail(type, data) {
            try {
                await fetch(APPS_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ type, ...data })
                });
                return { success: true };
            } catch (error) {
                console.error('Email send error:', error);
                return { success: false, message: error.toString() };
            }
        }
        
        document.getElementById('tbm-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = this.querySelector('.submit-btn');
            const originalText = btn.textContent;
            btn.textContent = '📄 PDF 생성 중...';
            btn.disabled = true;
            
            const risks = [];
            document.querySelectorAll('.risk-factor-group').forEach(group => {
                risks.push({
                    factor: group.querySelector('.risk-factor').value,
                    measure: group.querySelector('.risk-measure').value
                });
            });
            
            const workers = [];
            document.querySelectorAll('#workers-container .worker-signature-group').forEach(group => {
                const canvas = group.querySelector('.worker-canvas');
                workers.push({
                    name: group.querySelector('.worker-name').value,
                    signature: canvas.toDataURL()
                });
            });
            
            const data = {
                type: 'tbm',
                date: document.getElementById('tbm-date').value,
                location: document.getElementById('tbm-location').value,
                work: document.getElementById('tbm-work').value,
                risks: risks,
                supervisor: document.getElementById('tbm-supervisor').value,
                workers: workers,
                supervisorSignature: document.getElementById('supervisor-canvas').toDataURL()
            };
            
            setTimeout(async () => {
                btn.textContent = '📧 이메일 전송 중...';
                await sendEmail('tbm', data);
                setTimeout(() => {
                    alert('✅ 성공!\n\n📧 이메일 전송 완료\n📄 PDF 첨부 완료\n\n받은 편지함을 확인하세요!');
                    btn.textContent = originalText;
                    btn.disabled = false;
                    window.location.href = '../index.html';
                }, 1500);
            }, 2000);
        });
    </script>
</body>
</html>
