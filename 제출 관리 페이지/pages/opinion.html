<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>의견 제출</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .phone-container { width: 375px; height: 812px; background: white; border-radius: 25px; box-shadow: 0 20px 40px rgba(0,0,0,0.3); overflow: hidden; display: flex; flex-direction: column; }
        .page-header { display: flex; align-items: center; gap: 15px; padding: 15px 20px; border-bottom: 2px solid #f0f0f0; background: white; }
        .back-btn { background: none; border: none; font-size: 20px; cursor: pointer; padding: 5px; color: #2196F3; text-decoration: none; }
        .page-title { font-size: 20px; font-weight: bold; color: #333; flex: 1; }
        .page-content { flex: 1; padding: 20px; overflow-y: auto; }
        .form-group { margin-bottom: 20px; }
        .form-label { display: block; font-weight: 600; margin-bottom: 8px; color: #333; }
        .form-input { width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 16px; }
        .form-input:focus { outline: none; border-color: #2196F3; }
        .radio-group { display: flex; gap: 15px; }
        .radio-label { display: flex; align-items: center; gap: 5px; cursor: pointer; }
        .submit-btn { width: 100%; background: linear-gradient(135deg, #2196F3, #1976D2); color: white; border: none; padding: 15px; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 20px; }
        .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="phone-container">
        <div class="page-header">
            <a href="../index.html" class="back-btn">‹</a>
            <div class="page-title">의견 제출</div>
        </div>
        
        <div class="page-content">
            <form id="opinion-form">
                <div class="form-group">
                    <label class="form-label">📝 제목</label>
                    <input type="text" class="form-input" id="opinion-title" placeholder="의견 제목을 입력하세요" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label">💭 의견 내용</label>
                    <textarea class="form-input" id="opinion-content" rows="6" placeholder="개선사항, 건의사항, 불편사항 등을 자유롭게 작성해주세요" required></textarea>
                </div>
                
                <div class="form-group">
                    <label class="form-label">👤 제출 방식</label>
                    <div class="radio-group">
                        <label class="radio-label">
                            <input type="radio" name="anonymous" value="named" onchange="toggleNameInput()">
                            <span>실명 제출</span>
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="anonymous" value="anonymous" checked onchange="toggleNameInput()">
                            <span>익명 제출</span>
                        </label>
                    </div>
                </div>
                
                <div class="form-group" id="name-group" style="display: none;">
                    <label class="form-label">✍️ 성명</label>
                    <input type="text" class="form-input" id="opinion-name" placeholder="성명을 입력하세요">
                </div>
                
                <button type="submit" class="submit-btn">💭 의견 제출</button>
            </form>
        </div>
    </div>

    <script>
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwCkEBCWAtuayENtT7WjrslqVe4OCs6Z1zRoS3-8ltPfZo7iw_r28XGRNsf993gVC0EqQ/exec';
        
        function toggleNameInput() {
            const isNamed = document.querySelector('input[name="anonymous"][value="named"]').checked;
            const nameGroup = document.getElementById('name-group');
            const nameInput = document.getElementById('opinion-name');
            
            if (isNamed) {
                nameGroup.style.display = 'block';
                nameInput.required = true;
            } else {
                nameGroup.style.display = 'none';
                nameInput.required = false;
                nameInput.value = '';
            }
        }
        
        async function sendEmail(type, data) {
            try {
                await fetch(APPS_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ type, ...data })
                });
                return { success: true };
            } catch (error) {
                console.error('Email send error:', error);
                return { success: false };
            }
        }
        
        document.getElementById('opinion-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = this.querySelector('.submit-btn');
            const originalText = btn.textContent;
            btn.disabled = true;
            btn.textContent = '📧 전송 중...';
            
            const isAnonymous = document.querySelector('input[name="anonymous"]:checked').value === 'anonymous';
            const data = {
                type: 'opinion',
                title: document.getElementById('opinion-title').value,
                content: document.getElementById('opinion-content').value,
                anonymous: isAnonymous,
                name: isAnonymous ? '익명' : document.getElementById('opinion-name').value
            };
            
            await sendEmail('opinion', data);
            alert('✅ 의견이 이메일로 전송되었습니다!');
            btn.disabled = false;
            btn.textContent = originalText;
            window.location.href = '../index.html';
        });
    </script>
</body>
</html>
