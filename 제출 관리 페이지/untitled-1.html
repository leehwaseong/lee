<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>아차사고 신고 | 온세미로</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: linear-gradient(180deg,#f6f8fb,#eef2f6); }
    .card { border-radius: 1rem; box-shadow: 0 10px 25px rgba(0,0,0,.06); }
    .brand { margin-bottom:1rem; }
    .brand .title { font-weight:800; letter-spacing:.3px; margin:0; }
    .required::after { content:" *"; color:#dc3545; font-weight:700; }
    .is-valid{border-color:#198754!important; box-shadow:0 0 0 .2rem rgba(25,135,84,.15)!important;}
    .is-invalid{border-color:#dc3545!important; box-shadow:0 0 0 .2rem rgba(220,53,69,.15)!important;}
  </style>
</head>
<body>
  <div class="container py-4">
    <div class="mx-auto" style="max-width:960px;">

      <!-- 상단 바: 뒤로가기 -->
      <div class="d-flex align-items-center mb-3">
        <button id="backBtn" type="button" class="btn btn-outline-secondary">
          ← 뒤로가기
        </button>
      </div>

      <!-- 제목 -->
      <div class="brand">
        <h1 class="title">아차사고 신고</h1>
      </div>

      <!-- 본문 카드 -->
      <div class="card">
        <div class="card-body p-4 p-md-5">

          <!-- EmailJS는 action 필요 없음. id만 있으면 됨 -->
          <form id="nearMissForm" novalidate>
            <div class="row g-3">

              <div class="col-sm-4">
                <label class="form-label required" for="writer">작성자</label>
                <input class="form-control" id="writer" name="writer" required>
              </div>

              <div class="col-sm-4">
                <label class="form-label required" for="team">소속/팀</label>
                <input class="form-control" id="team" name="team" required>
              </div>

              <div class="col-sm-4">
                <label class="form-label required" for="phone">연락처</label>
                <input class="form-control" id="phone" name="phone" placeholder="010-0000-0000"
                       pattern="^0\\d{1,2}-?\\d{3,4}-?\\d{4}$" required>
              </div>

              <div class="col-sm-6">
                <label class="form-label required" for="occurredAt">발생일</label>
                <input type="date" class="form-control" id="occurredAt" name="occurredAt" required>
              </div>

              <div class="col-sm-6">
                <label class="form-label required" for="location">발생장소</label>
                <input class="form-control" id="location" name="location" required>
              </div>

              <div class="col-12">
                <label class="form-label required" for="work">작업내용</label>
                <textarea class="form-control" id="work" name="work" rows="2"
                          placeholder="예) A동 2층 배관 교체 작업 준비" required></textarea>
              </div>

              <div class="col-12">
                <label class="form-label required" for="nearMiss">아차사고 내용</label>
                <textarea class="form-control" id="nearMiss" name="nearMiss" rows="3"
                          placeholder="예) 전선에 발이 걸려 넘어질 뻔함. 동료가 부축하여 부상은 없음" required></textarea>
              </div>

              <div class="col-12">
                <label class="form-label" for="cause">기타 원인(선택)</label>
                <textarea class="form-control" id="cause" name="cause" rows="2"
                          placeholder="예) 전선 정리 미흡, 발판 가장자리 자재 적치"></textarea>
              </div>

              <div class="col-12">
                <label class="form-label required" for="counter">개선대책</label>
                <textarea class="form-control" id="counter" name="counter" rows="3"
                          placeholder="예) 작업 전 전선 고정, 발판 가장자리 적치 금지, TBM 시 강조" required></textarea>
              </div>

              <div class="col-sm-6">
                <label class="form-label required" for="severity">잠재중대성</label>
                <select class="form-select" id="severity" name="severity" required>
                  <option value="">선택</option>
                  <option>낮음</option>
                  <option>중간</option>
                  <option>높음</option>
                  <option>매우 높음</option>
                </select>
              </div>

              <!-- 숨김 메타/옵션 -->
              <input type="text" name="_gotcha" class="d-none" tabindex="-1" autocomplete="off"> <!-- honeypot -->
              <input type="hidden" name="submitId" id="submitId">
              <input type="hidden" name="clientTime" id="clientTime">
              <input type="hidden" name="userAgent" id="userAgent">
              <!-- 템플릿에서 제목으로 쓰고 싶으면 아래 hidden도 사용 -->
              <input type="hidden" name="subject" id="subject" value="[아차사고 신고] 새로운 접수">
            </div>

            <div class="d-flex align-items-center gap-2 mt-4">
              <button type="submit" id="submitBtn" class="btn btn-primary px-4">
                제출
              </button>
              <button type="button" id="resetBtn" class="btn btn-outline-secondary">초기화</button>
              <div class="ms-auto small text-muted">※ 제출 즉시 관리 메일로 전송됩니다.</div>
            </div>
          </form>

          <div id="okBox"  class="alert alert-success mt-4 d-none">제출되었습니다. 감사합니다.</div>
          <div id="errBox" class="alert alert-danger  mt-4 d-none">제출 중 오류가 발생했습니다. 잠시 후 다시 시도해주세요.</div>
        </div>
      </div>
    </div>
  </div>

  <!-- EmailJS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

  <script>
    // ====== EmailJS 초기화 (Public Key 넣기) ======
    (function(){
      emailjs.init("0rUU1apJo2do_xuDp"); // ← 여기에 Public Key
    })();

    // 요소 참조
    const form      = document.getElementById('nearMissForm');
    const submitBtn = document.getElementById('submitBtn');
    const resetBtn  = document.getElementById('resetBtn');
    const okBox     = document.getElementById('okBox');
    const errBox    = document.getElementById('errBox');

    const FIELDS = ["writer","team","phone","occurredAt","location","work","nearMiss","cause","counter","severity"];

    // 뒤로가기
    document.getElementById('backBtn').addEventListener('click', ()=>{
      if (history.length > 1) history.back();
      else window.location.href = "/";
    });

    // 실시간 유효성
    FIELDS.forEach(id=>{
      const el = document.getElementById(id);
      const handler = ()=>markValidity(el);
      el.addEventListener('input', handler);
      if (el.tagName === 'SELECT') el.addEventListener('change', handler);
    });
    function markValidity(el){
      const required = el.hasAttribute('required');
      const filled = String(el.value||'').trim() !== '';
      el.classList.remove('is-valid','is-invalid');
      if (required) el.classList.add(filled ? 'is-valid' : 'is-invalid');
      else if (filled) el.classList.add('is-valid');
    }

    // 초기화
    resetBtn.addEventListener('click', ()=>{
      form.reset();
      okBox.classList.add('d-none');
      errBox.classList.add('d-none');
      FIELDS.forEach(id=> document.getElementById(id).classList.remove('is-valid','is-invalid'));
    });

    // 제출(EmailJS)
    form.addEventListener('submit', async (e)=>{
      e.preventDefault();
      okBox.classList.add('d-none');
      errBox.classList.add('d-none');

      // 필수값 확인
      let firstBad = null;
      FIELDS.forEach(id=>{
        const el = document.getElementById(id);
        markValidity(el);
        if (!firstBad && el.hasAttribute('required') && String(el.value||'').trim()===''){
          firstBad = el;
        }
      });
      if (firstBad){ firstBad.focus(); return; }

      // 메타 값 부여
      document.getElementById('submitId').value   = 'NM' + Date.now() + Math.floor(Math.random()*1000);
      document.getElementById('clientTime').value = new Date().toISOString();
      document.getElementById('userAgent').value  = navigator.userAgent;

      // 중복 제출 방지
      if (submitBtn.disabled) return;
      submitBtn.disabled = true;
      const originalText = submitBtn.textContent;
      submitBtn.textContent = "제출 중…";

      try{
        // EmailJS 전송 (폼 전체 그대로 매핑)
        const SERVICE_ID  = "service_2xfhvyd";   // ← Service ID
        const TEMPLATE_ID = "template_b8w5rl9";  // ← Template ID

        await emailjs.sendForm(SERVICE_ID, TEMPLATE_ID, form);

        okBox.classList.remove('d-none');
        form.reset();
        FIELDS.forEach(id=> document.getElementById(id).classList.remove('is-valid','is-invalid'));
      } catch(err){
        console.error(err);
        errBox.classList.remove('d-none');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = originalText;
      }
    });
  </script>
</body>
</html>
